<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PR Club</title>
<meta name="description" content="Gym training in 4-week blocks, with levels, records and timers.">
<meta name="theme-color" content="#0B1026">
<meta name="color-scheme" content="dark">
<!-- Home Screen app on iPhone and Android: full screen, dark status bar, its own icon -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PR Club">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* PR Club: one phone-width column, sticky header, fixed tab bar. Dark navy with neon cyan for actions, magenta for records and yellow for XP. */
:root{
  --bg:#0B1026; --surface:#151C3A; --surface-2:#1D2650; --ink:#EEF1FF; --muted:#A9B2D6; --line:#26305C;
  --accent:#3DF5FF; --accent-ink:#0B1026; --accent-soft:#12344A; --hero:#151C3A;
  --pink:#FF3DCB; --pink-ink:#FF8BE0; --pink-soft:#2A1640; --xp:#FFD447;
  --p-red:#FF4D6D; --p-blue:#4D8DFF; --p-yellow:#FFD447; --p-green:#7CFF6B; --p-white:#E6E9F5;
  --good:#7CFF6B; --good-soft:#15331F; --warn:#FFB648; --warn-soft:#3A2A10; --gold:#FFD447; --gold-soft:#3A3210; --bad:#FF6B81; --bad-soft:#3D1624;
  --hole:#151C3A; --shadow:inset 0 0 0 1px #26305C;
  --display:'Chakra Petch','Arial Narrow',Arial,sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:18px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--p-blue);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(104px + env(safe-area-inset-bottom,0px))}
#view{display:flex;flex-direction:column;gap:14px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 6px}
.brand{display:flex;align-items:center;gap:8px}
.brand svg{width:28px;height:28px}
.brand-name{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.01em;text-transform:uppercase}
.who{display:flex;gap:4px;background:var(--surface-2);padding:0;border-radius:999px}
.who-btn{display:flex;align-items:center;gap:6px;border:0;background:transparent;min-height:44px;padding:4px 12px 4px 6px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.who-btn.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;color:#fff}
.who-btn .av{flex:none}

.card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-h h2{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.sec-note,.hint{font-size:13px;color:var(--muted)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;min-height:48px;padding:0 18px;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.04em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);text-decoration:none}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.sm{min-height:38px;font-size:16px;padding:0 14px;border-radius:11px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:6px 0}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;min-height:38px;font-weight:600;font-size:14px;color:var(--muted);padding:0 4px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:7px;color:var(--ink);text-decoration:none}
.chip.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.chip.off{color:var(--muted);text-decoration:line-through}
.chip.soft{border-color:transparent;background:var(--surface-2)}
.scroll-x{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}
.scroll-x .chip{flex:none}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:4px 9px;white-space:nowrap}
.pill.done{background:var(--good-soft);color:var(--good)}
.pill.next{background:var(--accent);color:var(--accent-ink)}
.pill.prog{background:var(--warn-soft);color:var(--warn)}
.pill.todo{background:var(--surface-2);color:var(--muted)}
.tag{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:2px 6px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.gold{background:var(--gold-soft);color:var(--gold)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.good{background:var(--good-soft);color:var(--good)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.blue{background:var(--surface-2);color:var(--p-blue)}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--gold-soft);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:13px}
.banner b{color:var(--gold)}
input.field,select.field,textarea.field{width:100%;min-height:44px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);padding:0 12px;font-size:16px}
textarea.field{padding:10px 12px;min-height:72px;resize:vertical}
input.field:focus,select.field:focus,textarea.field:focus{border-color:var(--accent);outline:none}
label.lab,div.lab{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}

.plate{--pc:var(--p-red);width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;background:radial-gradient(circle,var(--hole) 0 34%,var(--pc) 35% 100%);box-shadow:inset 0 0 0 3px rgba(0,0,0,.14);font-family:var(--display);font-weight:800;font-size:16px;color:var(--ink)}
.plate.sm{width:22px;height:22px;font-size:0;box-shadow:inset 0 0 0 2px rgba(0,0,0,.14)}
.pl-red{--pc:var(--p-red)} .pl-blue{--pc:var(--p-blue)} .pl-yellow{--pc:var(--p-yellow)} .pl-green{--pc:var(--p-green)} .pl-white{--pc:var(--p-white)}

.hero{position:relative;overflow:hidden;background:var(--hero);color:#fff;border-radius:22px;padding:18px 18px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.hero::after{content:"";position:absolute;right:-70px;bottom:-90px;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,transparent 0 22%,rgba(255,255,255,.10) 23% 58%,transparent 59% 64%,rgba(255,255,255,.07) 65% 100%);pointer-events:none}
.hero .eyebrow{color:rgba(255,255,255,.9)}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(46px,14vw,60px);line-height:.9;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap}
.hero .sub{font-size:14px;color:rgba(255,255,255,.94);grid-column:1/-1}
.ring{position:relative;width:84px;height:84px;z-index:1}
.ring svg{width:84px;height:84px;transform:rotate(-90deg)}
.ring .rl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring .rl b{font-family:var(--display);font-size:20px;font-weight:800;display:block}
.ring .rl small{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.9}
.ring-bg{stroke:rgba(255,255,255,.25)} .ring-fg{stroke:#fff}
.why{display:flex;flex-direction:column;gap:8px}
.why q{font-family:var(--display);font-size:20px;font-weight:700;quotes:"“" "”"}

.weeks{display:grid;grid-template-columns:repeat(auto-fit,minmax(60px,1fr));gap:8px}
.wk{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:5px}
.wk b{font-family:var(--display);font-size:20px;font-weight:800}
.wk.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.dots{display:flex;gap:3px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--good)}
.wk.on .dots i{background:rgba(127,127,127,.45)} .wk.on .dots i.on{background:var(--good)}

.wlist{display:flex;flex-direction:column;gap:10px}
.wcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:var(--surface);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.wcard .wb{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.wname{font-family:var(--display);font-weight:700;font-size:21px;text-transform:uppercase;letter-spacing:.02em}
.wfocus{font-size:14px;font-weight:600}
.wmeta{font-size:12px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);text-align:center}
.empty{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty h2{font-family:var(--display);font-weight:800;font-size:32px;text-transform:uppercase;line-height:1}

.wo{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.wo-in{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;display:flex;flex-direction:column;gap:12px;min-height:100%}
.wo-top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:10px;display:flex;flex-direction:column;gap:10px}
.wo-row{display:flex;align-items:center;gap:10px}
.back{border:0;background:var(--surface-2);width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.back svg{width:20px;height:20px}
.wo-title{flex:1;min-width:0}
.wo-title h2{font-family:var(--display);font-weight:800;font-size:26px;text-transform:uppercase;line-height:1}
.wo-title p{font-size:13px;color:var(--muted)}
.date-in{min-height:44px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:0 8px;font-size:16px;max-width:160px}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s}
.progline{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--muted)}

.ex{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.ex.blocked{box-shadow:inset 0 0 0 2px var(--bad)}
.ex-head{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.ex-acts{display:flex;gap:8px;width:100%;padding-left:42px}
.order{width:32px;height:32px;border-radius:9px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:19px;flex:none}
.ex-t{flex:1;min-width:0}
.ex-t h3{font-size:17px;font-weight:700;line-height:1.25}
.ex-sub{font-size:13px;color:var(--muted)}
.ex-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.icon-btn{border:0;background:var(--surface-2);border-radius:12px;min-height:44px;min-width:44px;justify-content:center;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--ink);text-decoration:none;flex:none}
.icon-btn svg{width:17px;height:17px}
.icon-btn.vid{background:var(--accent-soft);color:var(--accent)}
.sets{display:flex;flex-direction:column;gap:10px}
.set,.set-h{display:grid;grid-template-columns:30px minmax(0,1fr) 74px 62px 44px;gap:7px;align-items:center;position:relative}
.set-h{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-inline:2px}
.set-h span:nth-child(3),.set-h span:nth-child(4){text-align:center}
.sn{font-family:var(--display);font-weight:800;font-size:18px;text-align:center;line-height:1}
.sn em{display:block;font-style:normal;font-size:12px;font-family:var(--body);font-weight:800;color:var(--accent);letter-spacing:.04em}
.prev{border:0;background:none;text-align:left;font-size:13px;color:var(--muted);min-height:44px;padding:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.prev:disabled{opacity:.6;cursor:default}
.in{width:100%;height:48px;border-radius:11px;border:1.5px solid transparent;background:var(--surface-2);text-align:center;font-family:var(--display);font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;padding:0 4px}
.in::placeholder{color:var(--muted);opacity:.8;font-weight:600;font-size:16px}
.in:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.tick{width:48px;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.tick svg{width:22px;height:22px}
.set.done .in{background:var(--good-soft);color:var(--good)}
.set.done .tick{background:var(--good);border-color:var(--good);color:var(--accent-ink)}
.set.flash .in{border-color:var(--warn)}
.prbadge{position:absolute;right:54px;top:-8px;font-size:12px;font-weight:800;letter-spacing:.05em;background:var(--gold);color:var(--surface);border-radius:6px;padding:1px 5px;pointer-events:none}
.ex-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.summary{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;flex:1;min-width:0;justify-content:flex-end;text-align:right}
.summary b{color:var(--ink);font-variant-numeric:tabular-nums}
.moves{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;counter-reset:mv}
.moves li{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;counter-increment:mv}
.moves li::before{content:counter(mv);width:24px;height:24px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:14px;flex:none}
.moves li span{flex:1;min-width:0}
.rounds{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rnd{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-family:var(--display);font-weight:800;font-size:18px}
.rnd.on{background:var(--p-blue);border-color:var(--p-blue);color:#fff}
.how{background:var(--surface);border-radius:var(--r);padding:12px 14px;font-size:14px}
.how summary{font-weight:700;cursor:pointer}
.how ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px;color:var(--muted)}
.wo-foot{position:sticky;bottom:0;margin-top:auto;background:var(--bg);padding-top:8px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-direction:column;gap:8px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabbar-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;font-size:12px;font-weight:700;letter-spacing:.03em;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}

.pgrid{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:6px;align-items:center}
.pg-h{font-size:12px;font-weight:700;color:var(--muted);text-align:center}
.pg-l{font-size:13px;font-weight:700;padding-right:4px}
.pg-c{border:1.5px solid var(--line);background:var(--surface);border-radius:11px;min-height:44px;font-size:12px;font-weight:700;color:var(--ink);padding:4px}
.pg-c.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.plist{display:flex;flex-direction:column;gap:8px}
.pcard{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;width:100%}
.pcard b{display:block;font-size:15px}
.pcard small{display:block;font-size:12px;color:var(--muted)}
.pcard.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.ocard{align-items:flex-start}
.onum{flex:none;width:30px;height:30px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--ink)}
.ocard.cur .onum{background:var(--accent);color:var(--accent-ink)}
.ob{flex:1;min-width:0}
.pcard small.oa{color:var(--ink);opacity:.8;font-size:13px;line-height:1.4;margin-top:4px}
.pcard small.bad{color:var(--bad);margin-top:4px}
.copt{padding:0;gap:4px}
.copt-b{flex:1;min-width:0;border:0;background:none;text-align:left;padding:12px 2px;font:inherit;color:inherit}
.copt-b small{display:block;text-align:left;margin-top:2px}
.circ-tools{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.sched{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.sched div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:6px 2px}
.sched i{font-style:normal;font-size:10px;font-weight:600;min-height:22px;display:grid;place-items:center;text-align:center;line-height:1.1}
.switch{display:flex;gap:12px;align-items:center;font-size:14px;min-height:44px;padding-block:4px;cursor:pointer}
.switch input{width:24px;height:24px;accent-color:var(--accent);flex:none;margin:0}
.vol{display:flex;flex-direction:column;gap:7px}
.vrow{display:grid;grid-template-columns:86px minmax(0,1fr) 54px;gap:8px;align-items:center;font-size:13px}
.vrow .vn{font-weight:600}
.vtrack{position:relative;height:12px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.vtrack .ghost{position:absolute;inset:0 auto 0 0;background:var(--line);border-radius:99px}
.vtrack .fill{position:absolute;inset:0 auto 0 0;background:var(--p-blue);border-radius:99px}
.vtrack .fill.low{background:var(--warn)}
.vrow .vv{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.vrow .vv small{color:var(--muted);font-weight:500}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.pw{display:flex;flex-direction:column;gap:6px}
.pw-h{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:18px;text-transform:uppercase}
.slot{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.slot .order{width:26px;height:26px;font-size:15px;border-radius:7px}
.slot .st{flex:1;min-width:0;display:flex;flex-direction:column}
.slot .st b{font-weight:600;font-size:15px}
.slot .st small{font-size:12px;color:var(--muted)}
.slot .st small.bad{color:var(--bad);font-weight:600}

.big{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.big .num{font-size:52px;font-weight:800;line-height:.9}
.big .unit{font-family:var(--display);font-size:22px;font-weight:700;color:var(--muted)}
.delta{font-size:14px;font-weight:700}
.delta.good{color:var(--good)} .delta.warn{color:var(--warn)} .delta.flat{color:var(--muted)}
.gbar{display:flex;flex-direction:column;gap:6px}
.gbar .bar{height:10px}
.gbar .gl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px}
.bf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat small{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.stat b{font-family:var(--display);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tiles .stat{background:var(--surface);box-shadow:var(--shadow);padding:12px 14px}
.tiles .stat b{font-size:32px}
.tiles .stat span{font-size:12px;color:var(--muted)}
.chart svg{display:block;width:100%;height:auto}
.chart-empty{display:grid;place-items:center;min-height:120px;border:1.5px dashed var(--line);border-radius:14px;color:var(--muted);font-size:14px;text-align:center;padding:12px}
.c-grid{stroke:var(--line);stroke-width:1}
.c-lab{fill:var(--muted);font-size:11px;font-family:var(--body)}
.c-line{fill:none;stroke:var(--accent);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.c-area{fill:var(--accent);opacity:.1}
.c-dot{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.c-end{fill:var(--accent)}
.c-endlab{fill:var(--ink);font-size:13px;font-weight:700;font-family:var(--body)}
.c-goal{stroke:var(--good);stroke-width:1.6;stroke-dasharray:5 4}
.c-goallab{fill:var(--good);font-size:11px;font-weight:700;font-family:var(--body)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form .full{grid-column:1/-1}
.tbl-wrap{overflow-x:auto;margin-inline:-4px}
table.tbl{border-collapse:collapse;font-size:13px;min-width:100%;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:7px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.del{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;min-width:44px;min-height:44px;padding:0;border-radius:10px}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.lg{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.lg:first-of-type{border-top:0}
.lg .row b{font-weight:600}
.list{display:flex;flex-direction:column}
.list > div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.list > div:first-child{border-top:0}
.list small{color:var(--muted)}
.sess-list{display:flex;flex-direction:column;font-size:13px}
.sess-list div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.sess-list div span:last-child{text-align:right;font-variant-numeric:tabular-nums}

/* setup + player */
.q-wrap{display:flex;flex-direction:column;gap:14px;padding-block:6px 10px}
.q-step{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.q-title{font-family:var(--display);font-weight:800;font-size:32px;line-height:1.02;text-transform:uppercase}
.optc{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:16px;font-weight:600;color:var(--ink)}

.qdots{display:flex;gap:4px}
.qdots i{flex:1;height:4px;border-radius:9px;background:var(--line)}
.qdots i.on{background:var(--accent)}
.rec{display:flex;flex-direction:column;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.rec:first-child{border-top:0;padding-top:0}
.rec .rk{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rec .rv{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.1}
.rec p{font-size:14px;color:var(--muted)}
.sug{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.sug:first-child{border-top:0}

.player{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-block:8px calc(env(safe-area-inset-bottom,0px) + 16px)}

.sheet-back{position:fixed;inset:0;z-index:65;background:rgba(10,12,16,.45)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;max-height:84vh;max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:22px 22px 0 0;padding-top:10px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-in{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 4px}
.sheet h3{font-family:var(--display);font-weight:800;font-size:26px;text-transform:uppercase;line-height:1}
.opts{display:flex;flex-direction:column}
.opt{border:0;border-top:1px solid var(--line);background:none;text-align:left;padding:12px 2px;font-size:15px;font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--ink)}
.opt.cur{font-weight:700;color:var(--accent)}
.opt.dim{color:var(--muted)}
.opt small{color:var(--muted);font-size:12px;text-align:right}
.opt small.bad{color:var(--bad)}
.copt .copt-b small{text-align:left;font-weight:500}
.celebrate{text-align:center;align-items:center}
.celebrate .plate{width:84px;height:84px;font-size:30px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);z-index:90;background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;border-radius:12px;padding:10px 16px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:97;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:12px;height:12px;border-radius:50%;animation:fall 1.6s cubic-bezier(.3,.6,.5,1) forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(540deg);opacity:.9}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}.confetti{display:none}}

/* ===== PR Club: game layer ===== */
.hero{box-shadow:inset 0 0 0 2px var(--accent)}

.ring-bg{stroke:#26305C} .ring-fg{stroke:var(--accent)}
.rnd.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.prbadge{background:var(--pink);color:#0B1026}
.toast{background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 2px var(--accent)}
.wk.on{border-color:var(--accent);background:var(--surface-2);color:var(--ink)}
.chip.on{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.top-r{display:flex;align-items:center;gap:8px;min-width:0}
.lvl-chip{border:0;height:36px;border-radius:999px;background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--accent);color:var(--ink);font-family:var(--display);font-weight:700;font-size:13px;padding:0 10px;letter-spacing:.04em;flex:none}
.player-card{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow)}
.lvl-ring{position:relative;width:68px;height:68px;flex:none;border:0;background:none;padding:0;color:var(--ink)}
.lvl-ring svg{width:68px;height:68px;transform:rotate(-90deg)}
.lvl-ring .lr-in{position:absolute;inset:0;display:grid;place-items:center;line-height:1;text-align:center}
.lvl-ring small{font-family:var(--display);font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.08em;display:block}
.lvl-ring b{font-family:var(--display);font-size:26px;font-weight:700}
.pc-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.pc-top{display:flex;justify-content:space-between;align-items:baseline;gap:2px 8px;flex-wrap:wrap}
.pc-name{font-weight:800;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.xpbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.pc-meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.streak{display:inline-flex;align-items:center;gap:5px;font-family:var(--display);font-weight:700;font-size:13px;color:var(--xp);letter-spacing:.04em;white-space:nowrap}
.streak svg{width:16px;height:16px}
.streak.cold{color:var(--muted)}
.xpt{color:var(--xp);font-family:var(--display);font-weight:700}
.pill.xp{background:var(--gold-soft);color:var(--xp)}
.tag.rec{background:var(--pink-soft);color:var(--pink-ink);text-transform:none;letter-spacing:0;white-space:normal;line-height:1.35;padding:3px 7px}
.wo-xp{font-family:var(--display);font-weight:700;font-size:14px;color:var(--xp);white-space:nowrap}
.boss-k{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.12em;color:var(--pink-ink)}
.badges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 8px}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.badge svg{width:58px;height:58px}
.badge b{font-size:11px;font-weight:700;line-height:1.2}
.badge small{font-size:12px;color:var(--muted);line-height:1.25}
.badge.locked svg{opacity:.55}
.badge .bp{width:44px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.badge .bp i{display:block;height:100%;background:var(--accent)}
.recs{display:flex;flex-direction:column}
.rr{display:grid;grid-template-columns:minmax(0,1fr) 56px 56px 64px;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.rr:first-child{border-top:0}
.rr b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rr .rv{font-family:var(--display);font-weight:700;font-size:15px;text-align:right}
.rr .rv.new{color:var(--pink-ink)}
.rr-h{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700;text-transform:uppercase;text-align:right}
.lvl-card{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.lvl-big{width:96px;height:96px}
.qc{text-align:center;align-items:center}
.qc-emb{width:92px;height:92px;animation:crownIn .7s cubic-bezier(.2,.9,.3,1.3) both}
.qc-k{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.16em;color:var(--accent)}
.qc-xp{font-family:var(--display);font-weight:700;font-size:52px;color:var(--xp);line-height:1;text-shadow:0 0 18px rgba(255,212,71,.4)}
.qc-bar{width:100%;display:flex;flex-direction:column;gap:6px}
.qc-list{width:100%;display:flex;flex-direction:column;text-align:left}
.qc-list div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.qc-recs{width:100%;display:flex;flex-direction:column;gap:6px;text-align:left}
.qc-rec{display:flex;align-items:center;gap:10px;background:var(--pink-soft);border-radius:12px;padding:8px 10px;font-size:14px}
.qc-rec svg{width:22px;height:22px;flex:none}
.qc-badges{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.qc-msg{font-size:15px;line-height:1.45}
.fx{position:fixed;inset:0;z-index:95;display:grid;place-items:center;background:rgba(6,9,24,.86);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fxFade .25s ease both;cursor:pointer;padding:24px}
.fx.out{animation:fxOut .3s ease both}
.fx-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;max-width:340px}
.fx-rings{position:absolute;top:58px;left:50%;width:0;height:0;pointer-events:none}
.fx-rings i{position:absolute;left:-90px;top:-90px;width:180px;height:180px;border-radius:50%;border:3px solid var(--pink);opacity:0;animation:ringOut 1.5s cubic-bezier(.2,.7,.3,1) infinite}
.fx-rings i:nth-child(2){animation-delay:.4s;border-color:var(--accent)}
.fx-rings i:nth-child(3){animation-delay:.8s;border-color:var(--xp)}
.fx-icon{width:116px;height:116px;animation:crownIn .8s cubic-bezier(.2,.9,.3,1.35) both;filter:drop-shadow(0 0 18px rgba(255,61,203,.6))}
.fx-k{font-family:var(--display);font-weight:700;font-size:40px;letter-spacing:.06em;line-height:1;color:#fff;text-shadow:0 0 14px rgba(255,61,203,.9),0 0 34px rgba(255,61,203,.5);animation:pop .5s .15s cubic-bezier(.2,.9,.3,1.4) both}
.fx-type{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.16em;color:#0B1026;background:var(--accent);border-radius:999px;padding:4px 12px;animation:pop .4s .3s both}
.fx-val{font-family:var(--display);font-weight:700;font-size:56px;line-height:1;color:#fff;animation:pop .45s .4s both;font-variant-numeric:tabular-nums}
.fx-val small{font-size:22px;color:var(--muted)}
.fx-ex{font-size:17px;font-weight:700}
.fx-was{font-size:14px;color:var(--muted)}
.fx-xp{font-family:var(--display);font-weight:700;font-size:26px;color:var(--xp);animation:xpUp .6s .6s both}
.fx-more{font-size:13px;color:var(--pink-ink)}
.fx-tap{font-size:12px;color:var(--muted);margin-top:6px}
.brand-name{white-space:nowrap;font-size:20px}
.brand{flex:none}
.who{min-width:0}
.who-btn{max-width:150px;min-width:0;white-space:nowrap}
.who-btn .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.hero h1{font-size:clamp(28px,8.6vw,36px)}
@keyframes fxFade{from{opacity:0}to{opacity:1}}
@keyframes fxOut{to{opacity:0}}
@keyframes ringOut{0%{transform:scale(.25);opacity:.95}100%{transform:scale(1.9);opacity:0}}
@keyframes crownIn{0%{transform:translateY(24px) scale(.3) rotate(-18deg);opacity:0}60%{transform:translateY(-6px) scale(1.15) rotate(5deg);opacity:1}100%{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:none;opacity:1}}
@keyframes xpUp{0%{transform:translateY(16px);opacity:0}100%{transform:none;opacity:1}}
/* Level-up: everything picks up the tier colour from --tc / --tg / --tg2 / --tr set on the .fx element */
.fx.lvl .fx-k{text-shadow:0 0 14px var(--tg,rgba(61,245,255,.9)),0 0 34px var(--tg2,rgba(61,245,255,.5))}
.fx.lvl.big .fx-k{font-size:46px}
.fx.lvl .fx-icon{filter:drop-shadow(0 0 22px var(--tg2,rgba(61,245,255,.6)));animation:crownIn .8s cubic-bezier(.2,.9,.3,1.35) both,hexPulse 1.6s 1.1s ease-in-out infinite}
.fx.lvl .fx-type{background:var(--tc,var(--accent))}
.fx.lvl .fx-rings i{border-color:var(--tc,var(--accent))}
.fx.lvl .fx-rings i:nth-child(2){border-color:#fff}
.fx.lvl .fx-rings i:nth-child(3){border-color:var(--xp)}
.fx-rays{position:absolute;top:58px;left:50%;width:0;height:0;pointer-events:none}
.fx-rays i{position:absolute;left:-210px;top:-210px;width:420px;height:420px;border-radius:50%;background:repeating-conic-gradient(var(--tr,rgba(61,245,255,.2)) 0deg 7deg,transparent 7deg 20deg);-webkit-mask:radial-gradient(circle,#000 16%,transparent 68%);mask:radial-gradient(circle,#000 16%,transparent 68%);animation:raysIn .8s ease both,spin 18s linear infinite}
.fx.lvl.big .fx-rays i{animation:raysIn .8s ease both,spin 9s linear infinite}
.fx-name{display:block;max-width:100%}
.fx-letters{display:flex;flex-wrap:wrap;justify-content:center;column-gap:.32em;font-family:var(--display);font-weight:700;font-size:clamp(30px,9.4vw,42px);line-height:1.05;color:var(--tc,#fff);text-shadow:0 0 20px var(--tg2,transparent)}
.fx-letters .w{display:inline-flex;white-space:nowrap}
.fx-letters i{font-style:normal;display:inline-block;animation:letterIn .42s cubic-bezier(.2,.9,.3,1.5) both;animation-delay:calc(.55s + var(--i) * 45ms)}
.fx-line{font-size:16px;font-weight:600;color:var(--ink);animation:xpUp .5s 1.1s both}
.fx-tier{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--tc,var(--accent));border-radius:999px;padding:6px 14px;box-shadow:inset 0 0 0 2px var(--tc,var(--accent));animation:pop .5s 1.3s both}
.fx.lvl .fx-more{color:var(--xp);font-weight:700;font-size:14px}
.fx.lvl .fx-was{animation:xpUp .5s 1.4s both}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
@keyframes letterIn{0%{transform:translateY(.7em) scale(.3);opacity:0}100%{transform:none;opacity:1}}
@keyframes hexPulse{0%,100%{transform:none}50%{transform:scale(1.07)}}
@keyframes raysIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
/* Phone polish from the usability audit */

h1,h2,h3,.q-title,.pc-name,.fx-ex{overflow-wrap:anywhere}
.app{overflow-x:clip}
.lvl-chip{height:44px}
.chip{min-height:44px}
.seg button{min-height:44px}
.btn.sm{min-height:44px}
.link{min-height:44px;padding:10px 0}
p .link,.hint .link{min-height:0;padding:12px 4px;margin:-12px 0}
.how summary{padding:12px 0;margin:-2px 0}
.how{padding-block:2px}
.del:active{background:var(--surface-2)}
.toast{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);pointer-events:none;display:flex;align-items:center;gap:12px;width:max-content;max-width:calc(100% - 32px)}

.toast-act{border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;border-radius:10px;min-height:40px;padding:0 14px;font-size:14px}
.sheet-x{position:absolute;top:6px;right:max(8px,env(safe-area-inset-right,0px));width:44px;height:44px;border:0;border-radius:50%;background:var(--surface-2);color:var(--muted);display:grid;place-items:center;z-index:2}

.wo:has(.player.rest){background:#0A1433}
.wo:has(.player.ready){background:#141326}
.glossary{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin-top:8px;color:var(--muted);font-size:14px}
.glossary b{color:var(--ink)}
@media (max-width:379px){.who-btn .nm{display:none}.who-btn{padding:4px 10px 4px 6px}}
@media (max-height:500px) and (orientation:landscape){.wo-top,.top{position:static}.pring{width:min(40vh,200px)}}
.tbl td.td-del{padding:0 2px 0 0;width:44px}
/* Timers: shared controls */
.tb{width:52px;height:52px;border-radius:50%;border:0;background:var(--surface-2);color:var(--ink);display:grid;place-items:center;flex:none}
.tb svg{width:24px;height:24px}
.tb.main{width:64px;height:64px;background:var(--accent);color:var(--accent-ink)}
.tb.main svg{width:30px;height:30px}
.tb.sm{width:48px;height:48px}
.tb.x{background:transparent;color:var(--muted)}
.tb:active{transform:scale(.94)}
.tctl{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:auto;padding-top:6px}
.player{flex:1}
.tctl .tb{width:64px;height:64px}
.tctl .tb.main{width:84px;height:84px}
.tctl .tb.main svg{width:38px;height:38px}
/* Full-screen player: the colour says what to do from across the room */
.player{--pc:var(--accent)}
.player.rest{--pc:var(--p-blue)}
.player.ready{--pc:var(--xp)}
.player.paused{--pc:var(--muted)}
.player .pk{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--pc)}
.pring{position:relative;width:min(66vw,250px,32vh);width:min(66vw,250px,32dvh);aspect-ratio:1;display:grid;place-items:center}
.pring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.pring .pr-bg{fill:none;stroke:var(--line);stroke-width:12}
.pring .pr-fg{fill:none;stroke:var(--pc);stroke-width:12;stroke-linecap:round;transition:stroke-dasharray .25s linear}
.player .pt{font-family:var(--display);font-weight:700;font-size:clamp(52px,min(18vw,9vh),88px);line-height:1;font-variant-numeric:tabular-nums;position:relative}
.player .pl{font-family:var(--display);font-weight:700;font-size:clamp(24px,7.5vw,32px);text-transform:uppercase;line-height:1.05;max-width:22ch}
.player .psub{font-size:15px;font-weight:600;color:var(--muted)}
.player .pn{font-size:15px;color:var(--muted)}
/* Set timer docked at the foot of a workout */
.stbar{background:var(--surface-2);border-radius:16px;box-shadow:inset 0 0 0 2px var(--accent);overflow:hidden}
.stbar.idle,.stbar.done{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;box-shadow:inset 0 0 0 1px var(--line)}
.stbar .st-l{flex:1;min-width:0;display:flex;flex-direction:column}
.stbar .st-l b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stbar .st-l small{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stbar.run .st-l small{color:var(--accent);font-weight:700}
.st-top{display:flex;align-items:center;gap:8px;padding:8px 8px 0 14px}
.st-row{display:flex;align-items:center;gap:8px;padding:2px 8px 8px 14px}
.st-t{flex:1;font-family:var(--display);font-weight:700;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.st-row .tb{width:48px;height:48px}
.st-row .tb.main{width:56px;height:56px}
.st-dur{border:0;background:var(--surface);color:var(--ink);border-radius:999px;min-height:44px;padding:0 14px;font-family:var(--display);font-weight:700;font-size:16px;flex:none}
.st-dur small{font-size:12px;color:var(--muted);margin-left:2px}
.st-bar{display:block;height:4px;background:var(--line)}
.st-bar i{display:block;height:100%;background:var(--accent);transition:width .25s linear}
.stbar.paused{box-shadow:inset 0 0 0 2px var(--muted)}
.stbar.paused .st-t{color:var(--muted)}
.stbar.go{animation:goFlash 1.2s ease}
@keyframes goFlash{0%,60%{box-shadow:inset 0 0 0 3px var(--good);background:var(--good-soft)}}
.set.now{box-shadow:inset 0 0 0 2px var(--accent);border-radius:12px}
.wo-finish{margin-top:6px}
.circ-go{margin:4px 0 2px}
.circ-go svg,.btn svg{width:20px;height:20px}
/* Sliders */
.sl{display:flex;flex-direction:column;gap:4px}
.sl-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:600;font-size:15px}
.sl-h b{font-family:var(--display);font-size:18px;color:var(--accent);font-variant-numeric:tabular-nums}
.sl-row{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:8px;align-items:center}
.sl-b{width:44px;height:44px;border-radius:12px;border:0;background:var(--surface-2);color:var(--ink);font-size:22px;font-weight:700;line-height:1}
.sl-hint{font-size:12px;color:var(--muted)}
.sl-group{font-weight:700;font-size:13px;color:var(--ink);margin-top:6px}
.sl input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;touch-action:pan-y}
.sl input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:var(--line)}
.sl input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:var(--line)}
.sl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--accent);margin-top:-11px;box-shadow:0 0 0 4px rgba(61,245,255,.2)}
.sl input[type=range]::-moz-range-thumb{width:30px;height:30px;border:0;border-radius:50%;background:var(--accent)}
.ct-sum{font-size:15px;color:var(--muted);text-align:center}
.ct-sum b{color:var(--ink);font-family:var(--display);font-size:18px}
.rnd.on.nox{background:transparent;border:2px dashed var(--accent);color:var(--accent)}
.xp-rule{display:flex;flex-direction:column;gap:2px;border-radius:14px;padding:10px 14px;background:var(--warn-soft);box-shadow:inset 0 0 0 1px var(--warn)}
.xp-rule b{font-family:var(--display);font-size:16px;letter-spacing:.04em;text-transform:uppercase;color:var(--warn)}
.xp-rule span{font-size:14px;color:var(--ink)}
.xp-rule.ok{background:var(--good-soft);box-shadow:inset 0 0 0 1px var(--good)}
.xp-rule.ok b{color:var(--good)}
.qc-list .neg span{color:var(--muted)}
.qc-list .neg .xpt{color:var(--bad)}
.bk{font-family:ui-monospace,Menlo,monospace;font-size:16px;min-height:110px;resize:vertical;word-break:break-all}
.file-btn{position:relative;overflow:hidden;align-self:flex-start}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
a.btn{text-decoration:none}
/* Settings sheet */
.set-sec{display:flex;flex-direction:column;gap:10px;padding-top:16px;border-top:1px solid var(--line)}
.set-sec.first{border-top:0;padding-top:0}
.set-sec h4{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.set-sec .btn.sm{align-self:flex-start}
.inline-add{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:stretch}
.set-row{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:14px;padding:10px 12px}
.set-row b{display:block;font-size:15px}
.set-row small{display:block;font-size:13px;color:var(--muted)}
.set-lv{font-family:var(--display);font-weight:700;font-size:28px;min-width:36px;text-align:center}
.confirm{background:var(--bad-soft);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.confirm p{font-size:14px;line-height:1.45}
.btn.danger{background:var(--bad);color:#1A0710}
.danger-link{color:var(--bad);align-self:flex-start}
.who-btn .gear{display:grid;place-items:center;width:16px;height:16px;color:var(--muted);flex:none}
.who-btn .gear svg{width:16px;height:16px}
.set-link{margin-top:4px}
.set-link svg{width:20px;height:20px}
/* Level ladder on the Records tab */
.tier-note{font-size:13px;color:var(--muted)}
.ladder p.hint{margin:8px 0 4px}
.lt{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.lt-h{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:0 10px 2px}
.lrow{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:7px 10px;border-radius:10px}
.lrow .ln{font-family:var(--display);font-weight:700;font-size:16px;color:#8A94C4;text-align:center}
.lrow .lname{font-weight:600;color:var(--muted);min-width:0}
.lrow .lname small{display:block;font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.04em}
.lrow .lxp{text-align:right;font-family:var(--display);font-weight:700;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.lrow .lxp small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:#8A94C4}
.lrow.done .lname{color:var(--ink)}
.lrow.cur{background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--accent)}
.lrow.cur .lname{color:var(--ink);font-weight:800}
.lrow.cur .lxp{color:var(--ink)}
@media (prefers-reduced-motion: reduce){.fx,.fx *,.qc-emb{animation:none!important}.fx-rings,.fx-rays{display:none}.xpbar i{transition:none}}
</style>

/* One place decides when a level-up is celebrated. p.lvSeen is the highest level already celebrated on this phone,

function celebrateLevels(p,delay){
  if(!p)return;const g=game(p);
  if(p.lvSeen==null){p.lvSeen=g.level;save();return;}

}

function resolveGoals(p){
  let ch=false;
  p.goals.lifts.forEach(g=>{
    if(g.target==null&&g.auto){const h=exHistory(p,g.ex);if(h.length){const base=Math.max(...h[0].sets.map(s=>s.kg||0));if(base>0){const step=base>=20?2.5:1;let t=Math.ceil(base*(1+g.auto.pct/100)/step)*step;if(t<=base)t=base+step;g.target=t;g.base=base;ch=true;}}}
  });
  Object.entries(p.goals.metrics).forEach(([k,g])=>{if(g.target==null&&g.auto){const e=p.body.slice().sort((a,b)=>a.date<b.date?-1:1).find(x=>x[k]!=null);if(e){g.target=r1(e[k]+g.auto.delta);ch=true;}}});
  if(ch)save();
}

function niceTicks(min,max,n){const span=max-min||1;const raw=span/n;const mag=Math.pow(10,Math.floor(Math.log10(raw)));const e=raw/mag;const step=(e>=7.5?10:e>=3.5?5:e>=1.5?2:1)*mag;const lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step;const t=[];for(let v=lo;v<=hi+step/2;v+=step)t.push(+(Math.round(v/step)*step).toFixed(6));return {t,step};}
function lineChart(pts,o){

  if(lo===hi){lo-=1;hi+=1;}

  t.forEach(v=>{s+=`<line class="c-grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="c-lab" x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v.toFixed(dec)}</text>`;});

  if(o.goal!=null){const gy=Y(o.goal);s+=`<line class="c-goal" x1="${L}" x2="${W-R}" y1="${gy}" y2="${gy}"/><text class="c-goallab" x="${L+6}" y="${gy-5}">Goal ${kgS(o.goal)}</text>`;}
  const path=pts.map((p,i)=>`${i?'L':'M'}${X(xs[i]).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');

  pts.forEach((p,i)=>{if(i<pts.length-1)s+=`<circle class="c-dot" cx="${X(xs[i])}" cy="${Y(p.v)}" r="3.2"/>`;});

const okBF=v=>v>2&&v<60?r1(v):null;

/* age is stored with the date it was entered, so it rolls forward and each entry uses the age on that day */
const ageOn=(p,d)=>p.age?r1(p.age+(p.ageAt&&d?(parseISO(d)-parseISO(p.ageAt))/31557600000:0)):null;

const bodyFat=(p,e)=>bfAll(p,e).avg;
function bfMissing(p,e,k){const need=[];
  if(k==='navy'){if(!p.height)need.push('height');if(!e||!e.waist)need.push('waist');if(!e||!e.neck)need.push('neck');if(p.sex==='F'&&(!e||!e.hips))need.push('hips');}
  if(k==='ymca'){if(!e||!e.waist)need.push('waist');if(!e||!e.weight)need.push('weight');}
  if(k==='heritage'){if(!e||!e.weight)need.push('weight');if(!p.height)need.push('height');if(!p.age)need.push('age');}

/* progress */
function exPoints(p,name,metric){
  const by={};exHistory(p,name).forEach(h=>{const b=by[h.date]||(by[h.date]={d:h.date,top:0,e1:0,vol:0,reps:0,br:0});h.sets.forEach(s=>{b.top=Math.max(b.top,s.kg||0);b.e1=Math.max(b.e1,e1(s));b.vol+=(s.kg||0)*s.reps;b.reps+=s.reps;b.br=Math.max(b.br,s.reps);});});
  return Object.values(by).sort((a,b)=>a.d<b.d?-1:1).map(b=>({d:b.d,v:r1(b[metric])}));
}
const STRENGTH_TESTS=[['Squat',['BB back squat','BB front squat','Goblet squat','Leg press','BB box squat']],['Deadlift',['BB deadlift','BB sumo deadlift','DB deadlift (home)','BB RDL']],['Bench press',['BB bench press','DB chest press','DB incline press','Close grip bench press']],['Overhead press',['BB overhead press','DB overhead press','BB push press','DB arnold press']]];

  const planned=p.plan?planWorkouts(p).length*weeksOf(p).length:0;
  const blockSess=Object.keys(p.sessions).filter(k=>k.startsWith(prefix)).map(k=>p.sessions[k]);

  const blockPRs=g.recs.filter(x=>x.k.startsWith(prefix)).length;
  let lastVol=0,lastWeek=null;
  if(p.plan)weeksOf(p).forEach(w=>{let v=0;planWorkouts(p).forEach(x=>{const s=sess(p,w,x.id);if(s)Object.values(s.ex).forEach(e=>e.sets.forEach(st=>{if(st.done)v+=(st.kg||0)*(st.reps||0);}));});if(v>0){lastVol=v;lastWeek=w;}});

  <div class="stat"><small>Volume</small><b>${(lastVol/1000).toFixed(1)}t</b><span>${lastWeek?'Week '+lastWeek+' · kg × reps':'no sets yet'}</span></div>
  <div class="stat"><small>Records</small><b>${blockPRs}</b><span>broken this block</span></div></div>`;
  const names=[];const add=n=>{if(n&&!names.includes(n))names.push(n);};
  if(p.plan)planWorkouts(p).forEach(w=>w.slots.forEach(s=>add(s.ex)));
  Object.values(p.sessions).forEach(s=>Object.values(s.ex).forEach(e=>{if(e.sets.some(x=>x.done))add(e.name);}));
  if(!ui.progEx||!names.includes(ui.progEx)){const rising=names.find(n=>{const pts=exPoints(p,n,'top');return pts.length>2&&pts[pts.length-1].v>pts[0].v;});ui.progEx=rising||names.find(n=>exHistory(p,n).length)||names[0];}

  h+=goalsCard(p,names,ex);

  const notes=[];Object.values(p.sessions).forEach(s=>Object.values(s.ex).forEach(e=>{if(e.note)notes.push({d:s.date,n:e.name,t:e.note});}));notes.sort((a,b)=>a.d<b.d?1:-1);

  return h;

/* ================= Timers =================
   One engine for every countdown. A step is {kind:'ready'|'work'|'rest', label, sub, secs}.
   A running timer keeps startAt (when the current step began) and pausedAt (when paused), never a ticking counter,
   so it stays right when the phone sleeps or the app is in the background, and catches up on return.
   Two views use it: the full-screen player (circuits, HIIT, stretching) and the set timer docked under a workout. */
const TIMER_DEF={set:180,circWork:30,circRest:60,hiitWork:30,hiitRest:30,hiitRoundRest:120,sound:true};
/* [min, max, step] in seconds for each slider */

const mmss=s=>{s=Math.max(0,Math.ceil(s));return `${Math.floor(s/60)}:${pad(s%60)}`;};

  return {
    unlock(){try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();}catch(e){}},
    count(){tone(880,110,.22);buzz(30);},
    go(){tone(1320,420,.32);buzz([180]);},
    rest(){tone(620,420,.28);buzz([80,60,80]);},
    done(){tone(990,160,.3);setTimeout(()=>tone(1320,160,.3),190);setTimeout(()=>tone(1760,380,.32),380);buzz([80,60,80,60,200]);}
  };})();

/* ================= Full-screen player (circuits, HIIT, stretching) ================= */
function hiitPool(p){
  const ok=new Set([0,2,3,6,8,9,10,11]);const pick=ms=>Object.values(EX).filter(r=>ms.includes(r.m)&&ok.has(r.e)&&!blocked(p,r.n)).map(r=>r.n);
  return {lower:pick(['Quads','Glutes','Hamstrings']),upper:pick(['Chest','Back','Shoulders','Biceps','Triceps']),core:pick(['Core','Cardio'])};
}
function genHiit(p){const pool=hiitPool(p);const r=a=>a[Math.floor(Math.random()*a.length)];const l1=r(pool.lower),u1=r(pool.upper);let l2=r(pool.lower),u2=r(pool.upper);for(let i=0;i<6&&l2===l1;i++)l2=r(pool.lower);for(let i=0;i<6&&u2===u1;i++)u2=r(pool.upper);return [l1,u1,l2,u2,r(pool.core)];}
function hiitSheet(){
  const p=prof();if(!ui.hiit)ui.hiit=genHiit(p);const m=ui.hiit;const t=timers(p);const kinds=['Lower body','Upper body','Lower body','Upper body','Cardio / core'];
  sheet(`<h3>HIIT timer</h3><p class="hint">Five moves picked for you: each one twice per round, two rounds with a longer rest between. Only uses equipment you've ticked. Side quest XP needs at least 60% of the work time done.</p>
  <div class="list">${m.map((n,i)=>`<div><span><small>${kinds[i]}</small><br><b>${esc(n)}</b></span><a class="icon-btn vid" href="${vidUrl(n)}" target="_blank" rel="noopener" aria-label="Watch ${esc(n)} demo">${IC.play}</a></div>`).join('')}</div>
  ${sliderHTML('hiitWork','Work per move',t.hiitWork)}${sliderHTML('hiitRest','Rest between moves',t.hiitRest)}${sliderHTML('hiitRoundRest','Rest between rounds',t.hiitRoundRest)}
  <p class="ct-sum">About <b id="ct-total" data-kind="hiit">${durLabel(Math.round(stepsTotal(hiitSteps(p))/60)*60)}</b> in total</p>
  <div class="row"><button type="button" class="btn ghost" data-act="hiit-shuffle">Shuffle</button><button type="button" class="btn" data-act="hiit-start">${IC.play}Start</button></div>`);
}
function circuitSheet(){
  const p=prof();const {w}=curSession();const t=timers(p);const C=CIRCUITS[w.circuit.name]||{moves:[]};const wi=weeksOf(p).indexOf(p.week);const P=progOf(p);
  const R=+(String(P.rounds[wi]).split('-').pop())||1;
  sheet(`<h3>Circuit timer</h3><p class="hint">${esc(w.circuit.name)}: ${R} rounds of ${C.moves.length} moves, straight through, then rest. Rounds log themselves as you finish them. Skip a round's work and it isn't logged.</p>
  <ol class="moves">${C.moves.map(m=>`<li><span>${esc(m)}</span></li>`).join('')}</ol>
  ${sliderHTML('circWork','Time per exercise',t.circWork,`This block's plan this week: ${esc(dash(P.time[wi]))}`)}${sliderHTML('circRest','Rest between rounds',t.circRest)}
  <p class="ct-sum">About <b id="ct-total" data-kind="circuit">${durLabel(Math.round(stepsTotal(circuitSteps(p))/60)*60)}</b> in total</p>
  <button type="button" class="btn block" data-act="circ-start">${IC.play}Start circuit</button>`);
}
function startPlayer(title,kind,steps,ctx){
  ui.st=null;cue.unlock();
  ui.player={title,kind,steps,i:0,startAt:Date.now(),pausedAt:null,done:false,t0:Date.now(),total:stepsTotal(steps),ctx:ctx||null,logged:0,skipped:0,spent:[],beep:''};
  ui.mode='player';sheet('');openOverlay();wake.on();stepCue(ui.player);
}
/* Sound and announcement for the step the player has just entered */
function stepCue(pl){const s=pl.steps[pl.i];if(!s)return;(s.kind==='work'?cue.go:s.kind==='rest'?cue.rest:cue.count)();announce(`${s.kind==='work'?'Go':s.kind==='rest'?'Rest':'Get ready'}: ${s.label}, ${durLabel(s.secs)}`);}
/* Share of the work steps (optionally one round's) that actually ran */
function workDone(pl,round){const k=pl.steps.map((x,i)=>i).filter(i=>pl.steps[i].kind==='work'&&(round==null||pl.steps[i].round===round));
  const need=k.reduce((a,i)=>a+pl.steps[i].secs,0);return need?k.reduce((a,i)=>a+(pl.spent[i]||0),0)/need:1;}
/* When a round's last move is passed, log it if the work was done; a skipped round isn't logged at all */
function passStep(pl,s){
  if(pl.kind!=='circuit'||!s||s.kind!=='work'||!s.endsRound)return;
  if(workDone(pl,s.round)<ROUND_WORK_MIN){pl.skipped++;toast(`Round ${s.round} skipped, so it isn't logged`);return;}
  const p=prof();const ss=p.sessions[pl.ctx.key];if(!ss)return;const c=ss.circuit=ss.circuit||{rounds:0};
  pl.logged++;if(c.xr==null)c.xr=c.rounds||0;
  c.rounds=Math.max(c.rounds||0,pl.logged);c.xr=Math.max(c.xr,pl.logged);c.at=Date.now();if(!c.name)c.name=pl.ctx.name;save();
}
/* Move the player by d steps. auto: the step ran out, so the next one starts at the exact boundary (catching up after the screen was off).
   A tap starts the next step now. Back restarts the current step unless it's only just begun. */
function playerMove(d,auto){
  const pl=ui.player;if(!pl||pl.done)return;
  const now=Date.now(),cur=pl.steps[pl.i];
  /* Bank the time actually spent on this step (a step that ran out counts in full; pauses never count) */
  pl.spent[pl.i]=Math.min(cur.secs,(pl.spent[pl.i]||0)+(auto?cur.secs:Math.min(cur.secs,elapsedOf(pl))));
  if(d<0&&elapsedOf(pl)>3){pl.startAt=now;if(pl.pausedAt)pl.pausedAt=now;return;}
  if(d>0)passStep(pl,cur);
  const ni=pl.i+d;
  if(ni>=pl.steps.length){pl.done=true;finishPlayer(pl);return;}
  pl.i=Math.max(0,ni);
  pl.startAt=auto?pl.startAt+cur.secs*1000:now;if(pl.pausedAt)pl.pausedAt=now;
}
/* Leave the player: a circuit goes back to its workout, HIIT and stretching close */
function exitPlayer(){const pl=ui.player;if(pl&&pl.ctx){ui.player=null;ui.mode='workout';ui.open=pl.ctx.wid;renderOverlay();$('#wo').scrollTop=$('#wo').scrollHeight;}else closeOverlay();}
function playerExitSheet(){
  const pl=ui.player;const was=pl.pausedAt;if(!was)pl.pausedAt=Date.now();renderOverlay();
  const circ=pl.kind==='circuit';const done=Math.round((Date.now()-pl.t0)/1000);
  sheet(`<h3>Stop the timer?</h3><p class="hint">${circ?`${pl.logged} round${pl.logged===1?' is':'s are'} logged so far and stay logged.`:`You've done ${mmss(done)} of ${mmss(pl.total)}. Finish at least 60% to earn the side quest XP.`} The timer is paused.</p>
  <div class="row"><button type="button" class="btn ghost" data-act="closesheet">Keep going</button><button type="button" class="btn danger" data-act="pl-exit-yes">Stop</button></div>`);
}
function finishPlayer(pl){
  wake.on();cue.done();
  if(pl.kind==='hiit'||pl.kind==='stretch')sideQuestDone(pl);
  announce(pl.kind==='circuit'?`Circuit done. ${pl.logged} rounds logged.`:`${pl.title} done.`);
}
function playerHTML(){
  const pl=ui.player;
  if(pl.done){
    const circ=pl.kind==='circuit';
    const msg=circ?`${pl.logged} round${pl.logged===1?'':'s'} logged in the workout.${pl.skipped?` ${pl.skipped} skipped round${pl.skipped===1?' was':'s were'} left out.`:''}`
      :pl.xp?`<span class="xpt">+${XP.side} XP</span> added.`:pl.already?'Already counted today. Nice extra work.':'No XP this time: most of it was skipped. Do the full routine to earn it.';
    return `<header class="wo-top"><div class="wo-row"><button type="button" class="back" data-act="pl-exit" aria-label="${circ?'Back to workout':'Close'}">${IC.back}</button><div class="wo-title"><h2>${esc(pl.title)}</h2></div></div></header>
    <div class="player">${CROWN_SVG('qc-emb','#7CFF6B')}<span class="pl">${circ?'Circuit done':pl.xp||pl.already?'Side quest done':'Routine finished'}</span><p class="hint" style="max-width:34ch;text-align:center">${msg}</p>
    <button type="button" class="btn" data-act="pl-exit">${circ?'Back to workout':'Done'}</button></div>`;
  }
  const s=pl.steps[pl.i];const nx=pl.steps[pl.i+1];const left=s.secs-elapsedOf(pl);
  const totalLeft=left+pl.steps.slice(pl.i+1).reduce((a,x)=>a+x.secs,0);
  const r=88,c=2*Math.PI*r;const f=Math.min(1,Math.max(0,elapsedOf(pl)/s.secs));
  const paused=!!pl.pausedAt;
  return `<header class="wo-top"><div class="wo-row"><button type="button" class="back" data-act="pl-exit" aria-label="${pl.kind==='circuit'?'Back to workout':'Close'}">${IC.back}</button><div class="wo-title"><h2>${esc(pl.title)}</h2><p><span id="pl-tl">${mmss(totalLeft)}</span> left${pl.kind==='circuit'?` · ${pl.logged} round${pl.logged===1?'':'s'} logged`:''}</p></div></div>
    <div class="progline"><span class="bar"><i style="width:${Math.round(pl.i/pl.steps.length*100)}%"></i></span></div></header>
  <div class="player ${s.kind}${paused?' paused':''}">
    <span class="pk">${paused?'Paused':s.kind==='work'?'Go':s.kind==='rest'?'Rest':'Get ready'}</span>
    <div class="pring"><svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="${r}" class="pr-bg"/><circle cx="100" cy="100" r="${r}" class="pr-fg" id="pl-ring" stroke-dasharray="${(c*(1-f)).toFixed(1)} ${c.toFixed(1)}"/></svg><span class="pt" id="pl-t" role="timer">${mmss(left)}</span></div>
    <span class="pl">${esc(s.label)}</span>${s.sub?`<span class="psub">${esc(s.sub)}</span>`:''}${s.cue?`<p class="hint" style="max-width:34ch">${esc(s.cue)}</p>`:''}
    ${nx?`<span class="pn">Next: ${esc(nx.kind==='rest'?'Rest '+durLabel(nx.secs):nx.label)}</span>`:'<span class="pn">Last one</span>'}
    ${s.link?`<a class="icon-btn vid" href="${vidUrl(s.link)}" target="_blank" rel="noopener">${IC.play}Demo</a>`:''}
    <div class="tctl"><button type="button" class="tb" data-act="pl-prev" aria-label="Back">${IC.prev}</button><button type="button" class="tb main" data-act="pl-pause" aria-label="${paused?'Resume':'Pause'}">${paused?IC.play:IC.pause}</button><button type="button" class="tb" data-act="pl-next" aria-label="Skip to next">${IC.next}</button></div>
  </div>`;
}
/* HIIT and stretching earn side-quest XP once a day, only if at least 60% of the work time actually ran (pauses and skips don't count) */
function sideQuestDone(pl){
  const p=prof();if(!p)return;p.extras=p.extras||[];const today=isoToday();
  if(p.extras.some(x=>x.date===today&&x.kind===pl.kind)){pl.already=true;return;}
  if(workDone(pl)<SIDE_WORK_MIN)return;
  p.extras.push({date:today,kind:pl.kind});pl.xp=true;save();
  celebrateLevels(p,400);
}
/* Called four times a second: catch up any steps that ran out, beep the last three seconds, repaint the clock */
function updatePlayer(){
  const pl=ui.player;if(ui.mode!=='player'||!pl||pl.done||pl.pausedAt)return;
  const i0=pl.i;let guard=0;
  while(!pl.done&&elapsedOf(pl)>=pl.steps[pl.i].secs&&guard++<1000)playerMove(1,true);
  if(pl.done||pl.i!==i0){if(!pl.done)stepCue(pl);renderOverlay();return;}
  const s=pl.steps[pl.i];const left=s.secs-elapsedOf(pl);const sec=Math.ceil(left);
  if(sec<=3&&sec>=1&&pl.beep!==pl.i+':'+sec){pl.beep=pl.i+':'+sec;cue.count();}
  const t=$('#pl-t');if(t)t.textContent=mmss(left);
  const tl=$('#pl-tl');if(tl)tl.textContent=mmss(left+pl.steps.slice(pl.i+1).reduce((a,x)=>a+x.secs,0));
  const ring=$('#pl-ring');if(ring){const c=2*Math.PI*88;ring.setAttribute('stroke-dasharray',`${(c*Math.max(0,left)/s.secs).toFixed(1)} ${c.toFixed(1)}`);}
}

/* ================= Set timer (docked under a workout) =================
   Each set gets a window (3:00 by default): do the set, rest for whatever is left, go again on the beep.
   It starts when you log a set (or tap Start) and runs on through every set of the workout in order, skipping sets already logged.
   It only ever repaints its own bar, so it never steals focus from the kg and reps boxes. */
function stSteps(){const {w,s}=curSession();return w.slots.flatMap(sl=>{const e=s.ex[sl.id];return e.sets.map((x,i)=>({sid:sl.id,i,o:sl.o,name:e.name,n:e.sets.length,done:!!x.done}));});}
const stHere=()=>ui.st&&ui.open&&ui.mode==='workout'&&ui.st.key===curSession().key;
function stStart(sid,i){const {key}=curSession();cue.unlock();ui.st={key,sid,i,startAt:Date.now(),pausedAt:null,done:false,beep:'',go:0};paintSetTimer();}
function stOnLog(sid,i){if(!stHere())stStart(sid,i);}
function stIndex(steps){const st=ui.st;let k=steps.findIndex(x=>x.sid===st.sid&&x.i===st.i);return k<0?steps.findIndex(x=>!x.done):k;}
/* d=+1 next unlogged set, d=-1 previous set (or restart this one if it's more than 3 s in). auto keeps the exact boundary time. */
function stMove(d,auto){
  const st=ui.st;if(!st)return;const steps=stSteps();const k=stIndex(steps);const dur=timers(prof()).set;const now=Date.now();
  if(d<0){if(st.done||elapsedOf(st)>3||k<=0){st.done=false;}else{const pv=steps[k-1];st.sid=pv.sid;st.i=pv.i;}st.startAt=now;if(st.pausedAt)st.pausedAt=now;return;}
  const nx=steps.slice(k+1).find(x=>!x.done);
  if(!nx){st.done=true;st.pausedAt=null;return;}
  st.sid=nx.sid;st.i=nx.i;st.startAt=auto?st.startAt+dur*1000:now;if(st.pausedAt)st.pausedAt=now;st.go=Date.now();
}
function setTimerHTML(){
  const p=prof();const dur=timers(p).set;
  if(!stHere())return `<div class="stbar idle"><span class="st-l"><b>Set timer</b><small>Starts when you log a set</small></span><button type="button" class="st-dur" data-act="st-dur" aria-label="Time per set, ${durLabel(dur)}. Change">${mmss(dur)}</button><button type="button" class="tb sm" data-act="st-start" aria-label="Start set timer">${IC.play}</button></div>`;
  const st=ui.st;
  if(st.done)return `<div class="stbar done"><span class="st-l"><b>Every set logged</b><small>${curSession().w.circuit?'Circuit next. Its timer is on the circuit card.':'Finish the workout when you are ready.'}</small></span><button type="button" class="tb sm x" data-act="st-stop" aria-label="Stop set timer">${IC.x}</button></div>`;
  const steps=stSteps();const x=steps[stIndex(steps)]||steps[0];const left=dur-elapsedOf(st);const paused=!!st.pausedAt;
  return `<div class="stbar run${paused?' paused':''}${Date.now()-st.go<1500?' go':''}">
    <div class="st-top"><span class="st-l"><small>${esc(x.o)} · Set ${x.i+1} of ${x.n}${paused?' · paused':''}</small><b>${esc(x.name)}</b></span><button type="button" class="st-dur" data-act="st-dur" aria-label="Time per set, ${durLabel(dur)}. Change">${mmss(dur)}<small>/set</small></button></div>
    <div class="st-row"><b class="st-t" id="st-t" role="timer">${mmss(left)}</b>
      <button type="button" class="tb" data-act="st-prev" aria-label="Back">${IC.prev}</button><button type="button" class="tb main" data-act="st-pause" aria-label="${paused?'Resume':'Pause'}">${paused?IC.play:IC.pause}</button><button type="button" class="tb" data-act="st-next" aria-label="Next set">${IC.next}</button><button type="button" class="tb x" data-act="st-stop" aria-label="Stop set timer">${IC.x}</button></div>
    <span class="st-bar"><i id="st-fill" style="width:${Math.round(Math.min(1,elapsedOf(st)/dur)*100)}%"></i></span></div>`;
}
/* Repaint only the timer bar and the highlighted set row */
function paintSetTimer(scroll){
  const bar=$('#stbar');if(!bar)return;bar.innerHTML=setTimerHTML();
  document.querySelectorAll('.set.now').forEach(el=>el.classList.remove('now'));
  if(stHere()&&!ui.st.done){const row=$(`#set-${ui.st.sid}-${ui.st.i}`);if(row){row.classList.add('now');
    if(scroll){const r=row.getBoundingClientRect();const foot=bar.getBoundingClientRect().top;if(r.top<90||r.bottom>foot-8)row.scrollIntoView({block:'center',behavior:'smooth'});}}}
}
function updateSetTimer(force){
  if(!stHere()){if(force)paintSetTimer();return;}
  const st=ui.st;const dur=timers(prof()).set;
  if(!st.done&&!st.pausedAt){
    let moved=false,guard=0;while(!st.done&&elapsedOf(st)>=dur&&guard++<200){stMove(1,true);moved=true;}
    if(moved){if(st.done){cue.done();announce('Every set logged');}else{cue.go();const x=stSteps()[stIndex(stSteps())];announce(`Go: ${x.name}, set ${x.i+1}`);}paintSetTimer(true);return;}
    const sec=Math.ceil(dur-elapsedOf(st));if(sec<=3&&sec>=1&&st.beep!==st.sid+st.i+':'+sec){st.beep=st.sid+st.i+':'+sec;cue.count();}
  }
  if(force){paintSetTimer();return;}
  const t=$('#st-t');if(t)t.textContent=mmss(dur-elapsedOf(st));
  const f=$('#st-fill');if(f)f.style.width=Math.round(Math.min(1,elapsedOf(st)/dur)*100)+'%';
}
function setTimerSheet(){
  const p=prof();
  sheet(`<h3>Set timer</h3><p class="hint">Each set gets this long: do the set, rest for whatever is left, and go again on the beep. Tap skip if you're ready early.</p>
  ${sliderHTML('set','Time per set',timers(p).set)}
  <button type="button" class="btn block" data-act="closesheet">Done</button>`);
}

/* ================= Render ================= */
const TABS=[['train','Quests'],['plan','Plan'],['body','Body'],['progress','Records']];
function render(){
  const t=state.tab;
  $('.tabbar').hidden=!prof();
  if(!prof()){$('#view').innerHTML=welcomeView();return;}
  $('#view').innerHTML=header()+(t==='train'?trainView():t==='plan'?planView():t==='body'?bodyView():progressView());
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button type="button" class="tab" data-act="tab" data-id="${k}"${k===t?' aria-current="page"':''}>${IC[k]}${l}</button>`).join('');
}
function renderOverlay(){const wo=$('#wo');const st=wo.scrollTop;$('#wo-body').innerHTML=ui.mode==='workout'?workoutHTML():ui.mode==='setup'?setupHTML():ui.mode==='player'?playerHTML():'';wo.scrollTop=st;if(ui.mode==='workout')paintSetTimer();}
function openOverlay(){const wo=$('#wo');ui.woOpen=true;wo.hidden=false;syncLock();histSync();renderOverlay();wo.scrollTop=0;}
function openWorkout(wid){if(ui.st&&ui.open!==wid)ui.st=null;ui.open=wid;{const p=prof();const k=sk(p,p.week,wid);ui.openAt[k]=ui.openAt[k]||Date.now();}ui.mode='workout';ui.noteOpen={};state.resume={wid,t:Date.now()};openOverlay();save();wake.on();}
function closeOverlay(fromBack){const was=ui.woOpen;ui.open=null;ui.mode=null;ui.player=null;ui.st=null;ui.woOpen=false;$('#wo').hidden=true;syncLock();wake.off();if(state.resume){delete state.resume;save();}if(was&&!fromBack)histSync();render();}
/* toast(msg) for a quick note; toast(msg, undoFn) adds an Undo button for five seconds */
function toast(msg,undo){const t=$('#toast');t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button type="button" class="toast-act" data-act="undo">Undo</button>':''}`;t.classList.toggle('act',!!undo);ui.undo=undo||null;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>{t.hidden=true;ui.undo=null;},undo?5000:2600);}
/* Phone back button and back swipe. While a sheet or the workout/timer overlay is open, one extra "guard" history entry exists,
   so Back closes the top layer instead of leaving the app (and the guard comes back if another layer is still open).
   When the last layer closes from a button, the guard is removed a moment later, so closing one layer and opening the next
   in the same tap never races the browser's history. */
const hist={guard:false,skip:0,ok:true,t:0};
const layersOpen=()=>!!(ui.sheetOpen||ui.woOpen);
function histSync(){
  if(!hist.ok)return;
  if(layersOpen()&&!hist.guard){try{history.pushState({prc:1},'');hist.guard=true;}catch(e){hist.ok=false;}return;}
  if(!layersOpen()&&hist.guard){clearTimeout(hist.t);hist.t=setTimeout(()=>{if(!layersOpen()&&hist.guard){hist.guard=false;hist.skip++;try{history.back();}catch(e){hist.skip--;}}},80);}
}
function syncLock(){document.body.style.overflow=ui.sheetOpen||ui.woOpen?'hidden':'';document.body.classList.toggle('wo-open',!!ui.woOpen);}
/* sheet(html) opens or replaces the bottom sheet; sheet('') closes it. fromBack: closed by the phone's Back, so history already moved. */
function sheet(html,fromBack){
  const root=$('#sheet-root');
  if(!html){if(!ui.sheetOpen){root.innerHTML='';return;}root.innerHTML='';ui.sheetOpen=false;syncLock();if(!fromBack)histSync();
    const back=ui.sheetFrom;ui.sheetFrom=null;if(back&&document.body.contains(back)&&back.focus)try{back.focus({preventScroll:true});}catch(e){}return;}
  const fresh=!ui.sheetOpen;
  if(fresh)ui.sheetFrom=document.activeElement&&document.activeElement!==document.body?document.activeElement:null;
  root.innerHTML=`<div class="sheet-back" data-act="closesheet"></div><div class="sheet" role="dialog" aria-modal="true"><button type="button" class="sheet-x" data-act="closesheet" aria-label="Close">${IC.x}</button><div class="sheet-in"><div class="grab" aria-hidden="true"></div>${html}</div></div>`;
  ui.sheetOpen=true;syncLock();histSync();
  const h=root.querySelector('h3');if(h&&fresh){h.setAttribute('tabindex','-1');try{h.focus({preventScroll:true});}catch(e){}}
}
window.addEventListener('popstate',()=>{
  /* Our own guard removal. If a layer opened while it was in flight, put the guard back. */
  if(hist.skip>0){hist.skip--;if(layersOpen()){hist.guard=false;histSync();}return;}
  if(!hist.guard)return;
  hist.guard=false;
  const after=()=>histSync();setTimeout(after,0);
  document.querySelectorAll('.fx').forEach(e=>e.remove());fxQ.length=0;fxOn=false;
  if(ui.sheetOpen){sheet('',true);return;}
  if(!ui.woOpen)return;
  /* In a timer that's still running, Back asks first rather than throwing the session away */
  if(ui.mode==='player'&&ui.player&&!ui.player.done&&Date.now()-ui.player.t0>10000){playerExitSheet();return;}
  if(ui.mode==='player'&&ui.player&&ui.player.ctx){exitPlayer();return;}
  if(ui.mode==='setup'&&ui.setup&&ui.setup.step>0){ui.setup.step--;if(ui.setup.step<QS.length)ui.setup.picks=null;renderOverlay();return;}
  closeOverlay(true);
});
/* Drag a sheet down from its top to dismiss it */
let sheetDrag=null;
document.addEventListener('touchstart',ev=>{const sh=ev.target.closest('.sheet');if(!sh||sh.scrollTop>0||ev.target.closest('input,select,textarea'))return;sheetDrag={y:ev.touches[0].clientY,sh,dy:0};},{passive:true});

/* cols: optional list of colours (a level-up uses its tier colour), otherwise the app's party mix */
function confetti(cols){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.createElement('div');c.className='confetti';
  const pal=Array.isArray(cols)&&cols.length?cols:['var(--p-red)','var(--p-blue)','var(--p-yellow)','var(--p-green)','var(--p-white)'];
  for(let i=0;i<46;i++){const d=document.createElement('i');d.style.left=Math.random()*100+'%';d.style.background=pal[i%pal.length];d.style.setProperty('--dx',(Math.random()*160-80)+'px');d.style.animationDelay=(Math.random()*.35)+'s';const z=6+Math.random()*10;d.style.width=d.style.height=z+'px';c.appendChild(d);}
  document.body.appendChild(c);setTimeout(()=>c.remove(),2300);
}
