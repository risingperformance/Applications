/* ================= Actions ================= */
function curSession(){const p=prof();const w=planWorkouts(p).find(x=>x.id===ui.open);return {p,w,s:ensureSession(p,p.week,w),key:sk(p,p.week,w.id)};}
function tick(sid,i){
  const {p,w,s,key}=curSession();const e=s.ex[sid];const st=e.sets[i];
  /* A second tap within 0.8 s is a double-tap, not a request to un-log the set */
  if(st.done){if(Date.now()-(ui.tickAt[sid+':'+i]||0)<800)return;st.done=false;save();renderOverlay();return;}
  const hist=exHistory(p,e.name,key,s.date);const prev=hist.length?hist[hist.length-1].sets:null;
  const sl=w.slots.find(x=>x.id===sid);const wi=weeksOf(p).indexOf(p.week);const best=hist.reduce((m,h)=>Math.max(m,...h.sets.map(e1)),0);
  const kg=st.kg!=null?st.kg:phKg(e,i,prev,loadGuide(best,sl.reps[wi]));const reps=st.reps!=null?st.reps:phReps(e,i,prev);
  const need=(id,msg)=>{const row=$('#set-'+sid+'-'+i);if(row){row.classList.add('flash');setTimeout(()=>row.classList.remove('flash'),900);}const r=$(id);if(r)r.focus();toast(msg);};
  if(reps==null){need('#rp-'+sid+'-'+i,'Enter your reps for this set');return;}
  /* An empty kg box on a loaded lift would save as bodyweight, so ask for the weight instead */
  if(kg==null){const r=exRec(e.name);if(r&&LOADED.has(r.e)){need('#kg-'+sid+'-'+i,'Enter the weight for this set');return;}}
  const g0=game(p,key);const before=recsAgainst(g0.best,sessStats(s).ex);
  st.kg=kg==null?0:kg;st.reps=reps;st.done=true;ui.tickAt[sid+':'+i]=Date.now();save();renderOverlay();stOnLog(sid,i);
  /* A record only counts against an earlier finished session, so a first-ever log sets the baseline quietly */
  const fresh=recsAgainst(g0.best,sessStats(s).ex).filter(r=>r.n===e.name&&!before.some(b=>b.n===r.n&&b.type===r.type));
  if(fresh.length)recordFx(fresh);
}
/* Start a block: same number of training days where possible, week 1, swaps cleared and re-checked against equipment */
function pickProg(p,id){
  const P=PROGS[id];const keep=p.plan?{carry:p.plan.carry,trim:p.plan.trim}:{carry:true,trim:false};
  const n=p.plan?Math.min(p.plan.active.length,P.workouts.length):P.workouts.length;
  p.plan={prog:id,active:P.workouts.map(w=>w.id).slice(0,n),carry:keep.carry,swaps:{},trim:keep.trim};p.week=P.weeks[0];if(p.goals.weekly&&p.goals.weekly.target>n)p.goals.weekly.target=n;const fixed=autoFix(p);save();render();toast(`${progLabel(P)} set${fixed?`, ${fixed} swapped for your equipment`:''}`);
}
function finish(sure){
  const {p,w,s,key}=curSession();
  const done=w.slots.reduce((a,sl)=>a+s.ex[sl.id].sets.filter(x=>x.done).length,0);
  if(!done&&!s.circuit.rounds){toast('Log at least one set before finishing');return;}
  const left=w.slots.reduce((a,sl)=>a+s.ex[sl.id].sets.filter(x=>!x.done).length,0);
  const rc=ruleCheck(s,s.req||workoutReq(p,w));const rLeft=Math.max(0,rc.rTarget-rc.rd);
  if(!sure&&!s.done&&(left||rLeft||!rc.ok)){
    const msg=!rc.ok?`Finishing now saves the workout but earns <b>no XP</b>. Still needed: ${esc(ruleGaps(rc))}.`
      :`Finishing now earns <b>${Math.round(rc.scale*100)}% of this workout's XP</b> (${ruleWhy(rc)}).`;
    sheet(`<h3>Finish now?</h3><p class="hint">${msg}</p>
    <div class="row"><button type="button" class="btn ghost" data-act="closesheet">Keep going</button><button type="button" class="btn${rc.ok?'':' danger'}" data-act="finish-yes">${rc.ok?'Finish':'Finish anyway'}</button></div>`);return;}
  const was=s.done;const before=game(p,key);
  if(!was)s.req=workoutReq(p,w);
  s.done=true;if(w.circuit&&s.circuit&&!s.circuit.name)s.circuit.name=w.circuit.name;save();
  const changes=[];w.slots.forEach(sl=>{const e=s.ex[sl.id];if(groups(e.sets).length>1)changes.push(e.name);});
  resolveGoals(p);const after=game(p);closeOverlay();
  if(was){toast('Changes saved');return;}
  questComplete(p,w,key,before,after,changes);
}
/* The end-of-workout moment: XP counted up, the level bar filling, records, new badges and a line of genuine feedback */
function questComplete(p,w,key,before,after,changes){
  const me=after.per[key]||{xp:0,b:{},recs:[],vol:0,sets:0};const b=me.b;
  const sc=(p.sessions[key]||{}).circuit;const rushed=sc?Math.max(0,(sc.rounds||0)-xpRounds(sc)):0;const rc=me.rule;
  const gained=after.xp-before.xp;const lvUp=after.level>before.level;
  const lines=[['Sets logged',b.sets],['Quest complete',b.finish],['Circuit rounds',b.rounds],['Boss round cleared',b.boss],['Technique notes',b.notes],['Records broken',b.recs]];
  if(rc&&!rc.ok)lines.push(['Minimum not met, so no XP',-me.raw]);
  else if(rc&&rc.mult<1)lines.push([`${ruleWhy(rc)}: ${Math.round(rc.mult*100)}% of XP`,me.xp-me.raw]);
  if(after.st.weeks>before.st.weeks)lines.push(['Full week bonus',XP.week*(after.st.weeks-before.st.weeks)]);
  if(after.st.blocks>before.st.blocks)lines.push(['Block cleared',XP.block*(after.st.blocks-before.st.blocks)]);
  if(after.st.goals>before.st.goals)lines.push(['Goal hit',XP.goal*(after.st.goals-before.st.goals)]);
  const had=new Set(earned(before).map(x=>x.id));const newBadges=earned(after).filter(x=>!had.has(x.id));
  const prevBest=Math.max(0,...Object.values(before.per).map(x=>x.vol));const biggest=before.st.sessions>0&&me.vol>prevBest;
  const ws=planWorkouts(p);const nxt=ws.find(x=>!(sess(p,p.week,x.id)||{}).done);
  let msg;
  if(rc&&!rc.ok)msg=`Saved, but no XP this time. Still needed: ${esc(ruleGaps(rc))}. A workout needs ${ruleNeed(rc)} to earn XP.`;
  else if(before.st.sessions===0)msg=`First quest done. Welcome to PR Club, ${esc(p.name)}.`;
  else if(me.recs.length)msg=`${me.recs.length} new record${me.recs.length>1?'s':''} today. That's progress you can measure.`;
  else if(after.st.weeks>before.st.weeks)msg=`Every quest this week is done. That's how blocks get cleared.`;
  else if(after.st.streak>before.st.streak&&after.st.streak>1)msg=`${after.st.streak} weeks in a row on target. Keep it rolling.`;
  else if(nxt)msg=`In the bank. Next up: ${esc(nxt.name)} on ${dayOf(p,nxt.id)}.`;
  else msg=`Week done. Rest well and come back stronger.`;
  sheet(`<div class="qc sheet-in">${CROWN_SVG('qc-emb','#3DF5FF')}<span class="qc-k">QUEST COMPLETE</span><h3>${esc(w.name)}</h3>
  <span class="qc-xp" aria-label="${gained} XP earned">+<span data-count="${gained}" data-from="0" data-fmt="int">${gained}</span> XP</span>
  <div class="qc-bar"><div class="pc-meta"><span>Level ${before.level}${lvUp?' → '+after.level:''}</span><span class="rank" style="color:${after.lv.tier.c}">${esc(after.lv.name)}</span></div><div class="xpbar"><i id="qc-fill" style="width:${lvlPct(before.xp)}%"></i></div>
  <div class="pc-meta"><span>${nextLine(after,false)}</span>${streakHTML(after)}</div></div>
  <p class="qc-msg">${msg}</p>
  ${me.recs.length?`<div class="qc-recs">${me.recs.map(r=>`<div class="qc-rec">${CROWN_SVG('','#FF3DCB')}<span><b>${REC_LABEL[r.type]}</b> · ${esc(r.n)}<br><small>${recVal(r,r.v)} ${recUnit(r)}, was ${recVal(r,r.was)}</small></span></div>`).join('')}</div>`:''}
  ${newBadges.length?`<span class="eyebrow" style="color:var(--xp)">Badge${newBadges.length>1?'s':''} unlocked</span><div class="qc-badges">${newBadges.map(x=>`<div class="badge">${badgeSVG(x,true,64)}<b>${esc(x.name)}</b><small>${esc(x.d)}</small></div>`).join('')}</div>`:''}
  <div class="qc-list">${lines.filter(l=>l[1]!==0).map(l=>`<div${l[1]<0?' class="neg"':''}><span>${l[0]}</span><span class="xpt">${l[1]<0?'−'+(-l[1]):'+'+l[1]}</span></div>`).join('')}</div>
  <div class="bf" style="width:100%"><div class="stat"><small>Sets</small><b>${me.sets}</b></div><div class="stat"><small>Volume kg</small><b>${Math.round(me.vol).toLocaleString('en-AU')}</b></div><div class="stat"><small>Streak</small><b>${after.st.streak}<span style="font-size:14px;color:var(--muted)"> wk</span></b></div></div>
  ${biggest?'<span class="tag rec">Biggest workout yet by volume</span>':''}
  ${rushed?`<p class="hint">${rushed} circuit round${rushed>1?'s were':' was'} logged too quickly to earn XP.</p>`:''}
  ${changes.length?`<p class="hint">Weight changed mid-session on ${esc(changes.join(', '))}. Each set was saved with its own weight.</p>`:''}
  <button type="button" class="btn block" data-act="closesheet">Back to quests</button></div>`);
  document.querySelectorAll('.qc [data-count]').forEach(n=>countUp(n,0,+n.dataset.count,'int'));
  const el=$('#qc-fill');
  if(el)setTimeout(()=>{el.style.width=(lvUp?100:lvlPct(after.xp))+'%';
    if(lvUp)setTimeout(()=>{el.style.transition='none';el.style.width='0%';void el.offsetWidth;el.style.transition='';el.style.width=lvlPct(after.xp)+'%';},1200);},150);
  confetti();
  celebrateLevels(p,1000);
}
function findSlot(p,sid){return planWorkouts(p).flatMap(w=>w.slots).find(x=>x.id===sid);}
function openSwap(sid){
  const p=prof();const sl=findSlot(p,sid);if(!sl)return;ui.swapSid=sid;ui.swapQ='';
  sheet(`<h3>Swap ${esc(sl.ex)}</h3><p class="hint">Applies to the whole block. Showing ${esc(sl.m.toLowerCase())} exercises from the exercise library. Flagged ones need equipment or a movement you've switched off.</p>
  <input type="search" class="field" id="swap-q" placeholder="Search every exercise" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="Search exercises"><div class="opts" id="swap-list">${swapList(p,sl,'')}</div>`);
}
function swapList(p,sl,q){
  const ql=q.trim().toLowerCase();
  let list=ql?Object.keys(EX).filter(n=>n.toLowerCase().includes(ql)).sort():(BY_M[sl.m]||[]).slice();
  list=list.filter(n=>n!==sl.def);list.sort((x,y)=>(blocked(p,x)?1:0)-(blocked(p,y)?1:0));
  const opts=[sl.def].concat(list);
  return opts.map(n=>{const bl=blocked(p,n);return `<button type="button" class="opt${n===sl.ex?' cur':''}${bl?' dim':''}" data-act="pickswap" data-name="${esc(n)}"><span>${esc(n)}</span><small class="${bl?'bad':''}">${bl?esc(bl):n===sl.def?'Default':n===sl.ex?'Current':''}</small></button>`;}).join('')||'<p class="hint">No matches.</p>';
}
function openCircuitSwap(wid){
  const p=prof();const w=planWorkouts(p).find(x=>x.id===wid);if(!w||!w.circuit)return;ui.swapSid=wid+'d';
  ui.circF='All';
  sheet(`<h3>Swap ${esc(w.circuit.name)}</h3><p class="hint">Applies to the whole block. All 35 circuits, each with a follow-along video. Flagged ones need equipment or a movement you've switched off.</p>
  <div class="circ-tools"><div class="chips" role="group" aria-label="Circuit focus">${CIRC_FOCI.map(f=>`<button type="button" class="chip${f===ui.circF?' on':''}" data-act="circf" data-f="${f}" aria-pressed="${f===ui.circF}">${f}</button>`).join('')}</div>
  <input type="search" class="field" id="circ-q" placeholder="Search by move, e.g. lunge or swing" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="Search circuits"></div>
  <div class="opts" id="circ-list">${circList(p,w,'')}</div>`);
}
function circList(p,w,q){
  const ql=q.trim().toLowerCase();
  const hit=n=>(ui.circF==='All'||CIRCUITS[n].focus===ui.circF)&&(!ql||n.toLowerCase().includes(ql)||CIRCUITS[n].moves.some(m=>m.toLowerCase().includes(ql)));
  const list=CIRC_NAMES.filter(n=>n!==w.circuit.def&&hit(n)).sort((x,y)=>(circBlocked(p,x)?1:0)-(circBlocked(p,y)?1:0));
  const opts=(hit(w.circuit.def)?[w.circuit.def]:[]).concat(list);
  return opts.map(n=>{const C=CIRCUITS[n];const bl=circBlocked(p,n);const tag=n===w.circuit.def?' · Default':(n===w.circuit.name?' · Current':'');
    return `<div class="opt copt${n===w.circuit.name?' cur':''}${bl?' dim':''}"><button type="button" class="copt-b" data-act="pickcirc" data-name="${n}"><span>${n}${tag}</span><small>${esc(C.focus)} · ${esc(C.moves.join(' · '))}</small>${bl?`<small class="bad">${esc(bl)}</small>`:''}</button><a class="icon-btn vid" href="${yt(C.v)}" target="_blank" rel="noopener" aria-label="Watch the ${n} follow-along">${IC.play}</a></div>`;}).join('')||'<p class="hint">No circuits match.</p>';
}

  cue.unlock();
  const a=ev.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;const p=prof();
  switch(act){
    case 'tab':state.tab=a.dataset.id;save();sheet('');render();window.scrollTo(0,0);break;
    case 'settings':settingsSheet();break;
    case 'switch':state.active=a.dataset.id;ui.planFam=null;ui.progEx=null;save();sheet('');render();window.scrollTo(0,0);break;
    case 'start':case 'addp':{const el=$(act==='start'?'#w-name':'#np-name');const n=cleanName(el&&el.value);if(!n){toast('Type a name first');if(el)el.focus();break;}sheet('');addProfile(blankProfile(uid(),n));toast(`Welcome, ${n}`);break;}

    case 'pick':{const id=a.dataset.id;if(p.plan&&p.plan.prog===id)break;

      if(cur&&(logged||swaps||p.week!==cur.weeks[0])){

      pickProg(p,id);break;}
    case 'pick-yes':sheet('');pickProg(p,a.dataset.id);break;
    case 'days':{const n=+a.dataset.n;p.plan.active=progOf(p).workouts.map(w=>w.id).slice(0,n);save();render();break;}
    case 'toggle':{const id=a.dataset.wid;const act2=p.plan.active;if(act2.includes(id)){if(act2.length<=2){toast('Keep at least 2 training days');break;}p.plan.active=act2.filter(x=>x!==id);}else{p.plan.active=progOf(p).workouts.map(w=>w.id).filter(x=>act2.includes(x)||x===id);}save();render();break;}
    case 'equip':{const i=+a.dataset.i;p.equip[i]=p.equip[i]===false;save();render();break;}
    case 'move':{const k=a.dataset.k;p.moves[k]=p.moves[k]===false;save();render();break;}
    case 'autofix':{const n=autoFix(p);save();render();toast(n?`Swapped ${n} exercise${n>1?'s':''}`:'Nothing to swap');break;}
    case 'lvreset':settingsSheet('lv');break;
    case 'lvreset-yes':{const g=game(p);p.lvReset={date:isoToday(),paid:g.paid};p.lvSeen=1;save();render();settingsSheet();toast(`${p.name} is back to level 1, ${LADDER[0].name}`);break;}
    case 'lvundo':{delete p.lvReset;p.lvSeen=game(p).level;save();render();settingsSheet();toast(`Levels restored. ${p.name} is level ${p.lvSeen} again`);break;}
    case 'gobody':state.tab='body';save();sheet('');render();setTimeout(()=>{const el=$('#body-settings');if(el)window.scrollTo(0,el.getBoundingClientRect().top+scrollY-70);},60);break;
    case 'resetdemo':settingsSheet('demo');break;
    case 'backup':backupSheet();break;
    case 'backup-copy':{const el=$('#bk-out');const txt=el?el.value:'';
      const done=()=>toast('Backup copied');const fallback=()=>{if(el){el.focus();el.select();try{document.execCommand('copy');done();}catch(e){toast('Select the text and copy it');}}};
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,fallback);else fallback();break;}
    case 'restore':restoreSheet();break;
    case 'restore-yes':{const b=readBackup(($('#bk-in')||{}).value);if(!b){toast("That doesn't look like a PR Club backup");break;}
      const n=Object.keys(b.profiles).length;state=b;delete state.resume;save();sheet('');render();toast(`Backup restored · ${n} ${n===1?'person':'people'}`);break;}
    case 'resetyes':state=seed();save();sheet('');render();toast('Demo reset');break;
    case 'metric':ui.bodyMetric=a.dataset.k;render();break;
    case 'savegoal':{const t=num($('#g-target').value);if(t==null){toast('Enter a goal number');break;}const by=$('#g-by').value||null;p.goals.metrics[ui.bodyMetric]={target:t,by};save();render();toast('Goal saved');break;}
    case 'cleargoal':delete p.goals.metrics[ui.bodyMetric];save();render();break;
    case 'savebody':{const date=$('#f-date').value;if(!date){toast('Pick a date');break;}const e={date};let any=false;
      METRICS.filter(m=>!m.derived).forEach(m=>{const el=$('#f-'+m.k);if(!el)return;const v=num(el.value);if(v!=null){e[m.k]=v;any=true;}});
      if(!any){toast('Enter at least one measurement');break;}
      const g0=game(p);const ex=p.body.find(x=>x.date===date);if(ex){Object.assign(ex,e);delete ex.sample;}else p.body.push(e);resolveGoals(p);save();render();
      const g1=game(p);toast(g1.xp>g0.xp?`Entry saved · +${g1.xp-g0.xp} XP`:'Entry saved for '+fmtD(date));celebrateLevels(p,500);break;}
    case 'delbody':{const d=a.dataset.d;const gone=p.body.find(x=>x.date===d);p.body=p.body.filter(x=>x.date!==d);save();render();if(gone)toast(`Entry for ${fmtD(d)} deleted`,()=>{p.body.push(gone);});break;}
    case 'clearsamples':p.body=p.body.filter(x=>!x.sample);Object.keys(p.goals.metrics).forEach(k=>{if(p.goals.metrics[k].sample)delete p.goals.metrics[k];});p.goals.lifts=p.goals.lifts.filter(g=>!g.sample);if(p.goals.weekly&&p.goals.weekly.sample)p.goals.weekly=null;if(p.heightSample){p.height=null;p.age=null;p.ageAt=null;p.heightSample=false;}save();render();toast('Sample entries cleared');break;
    case 'savesettings':{p.height=num($('#s-height').value);{const a=num($('#s-age').value);if(a!==(p.age?Math.floor(ageOn(p,isoToday())):null)){p.age=a;p.ageAt=a?isoToday():null;}}p.heightSample=false;p.sex=$('#s-sex').value;save();render();toast('Settings saved');break;}
    case 'pmetric':ui.progMetric=a.dataset.k;render();break;
    case 'lgtype':ui.lgType=a.dataset.t;render();break;
    case 'addlift':{const n=$('#lg-ex').value;const t=num($('#lg-t').value);if(!n||t==null){toast('Pick an exercise and a target');break;}
      const g={id:uid(),ex:n,type:ui.lgType,target:ui.lgType==='reps'?Math.round(t):t};if(ui.lgType==='reps'){const at=num(($('#lg-at')||{}).value);if(at)g.atKg=at;}
      p.goals.lifts=p.goals.lifts.filter(x=>!(x.ex===n&&x.type===g.type));p.goals.lifts.push(g);save();render();toast('Goal added');break;}
    case 'dellift':{const k=p.goals.lifts.findIndex(g=>g.id===a.dataset.id);if(k<0)break;const [gone]=p.goals.lifts.splice(k,1);save();render();toast('Goal removed',()=>{p.goals.lifts.splice(k,0,gone);});break;}
    case 'delgoal':{const k=a.dataset.k;const was=p.goals[k];p.goals[k]=null;save();render();toast('Goal removed',()=>{p.goals[k]=was;});break;}
    case 'setup':startSetup();break;
    case 'su-close':closeOverlay();break;
    case 'su-back':ui.setup.step=Math.max(0,ui.setup.step-1);if(ui.setup.step<QS.length)ui.setup.picks=null;renderOverlay();break;
    case 'su-opt':{const q=QS[ui.setup.step];const A=ui.setup.a;const v=a.dataset.v;
      if(q.multi){const cur=A[q.k]||[];if(cur.includes(v))A[q.k]=cur.filter(x=>x!==v);else if(cur.length<q.multi)A[q.k]=cur.concat(v);else{toast(`Pick up to ${q.multi}`);break;}}else A[q.k]=v;
      renderOverlay();break;}
    case 'su-next':{const q=QS[ui.setup.step];if(!qValid(q,ui.setup.a))break;ui.setup.step++;ui.setup.picks=null;renderOverlay();$('#wo').scrollTop=0;break;}
    case 'su-days':ui.setup.days=+a.dataset.n;ui.setup.picks=null;renderOverlay();break;
    case 'su-apply':{const st=ui.setup;const {r0,r}=setupRec(st);applyCore(p,st.a,r);(st.picks||[]).forEach(s=>{if(s.on)p.plan.swaps[s.sid]=s.to;});presetGoals(p,st.a,r);
      const P=PROGS[r.prog];p.setup={answers:clone(st.a),rec:`${FAM[r.fam].style} · ${progLabel(P)} · ${r.days} days a week${r.days!==r0.days?` (recommended ${r0.days})`:''}`,date:isoToday()};
      save();ui.setup=null;state.tab='train';closeOverlay();toast(`${p.name}'s plan is set`);break;}
    case 'hiit':ui.hiit=null;hiitSheet();break;
    case 'hiit-shuffle':ui.hiit=genHiit(p);hiitSheet();break;
    case 'hiit-start':{const steps=hiitSteps(p);startPlayer(`HIIT · ${Math.round(stepsTotal(steps)/60)} min`,'hiit',steps);break;}
    case 'stretch':startPlayer('Start Stretching','stretch',[{kind:'ready',label:'Get ready',sub:`First up: ${STRETCHES[0][0]}`,secs:READY_SECS}].concat(STRETCHES.map(([l,c],k)=>({label:l,cue:c,secs:30,kind:'work',sub:`Stretch ${k+1} of ${STRETCHES.length}`}))));break;
    case 'pl-pause':{const pl=ui.player;if(!pl||pl.done)break;if(pl.pausedAt){pl.startAt+=Date.now()-pl.pausedAt;pl.pausedAt=null;}else pl.pausedAt=Date.now();renderOverlay();break;}
    case 'pl-next':{const pl=ui.player;playerMove(1,false);if(!pl.done)stepCue(pl);renderOverlay();break;}
    case 'pl-prev':{const pl=ui.player;playerMove(-1,false);if(!pl.done)stepCue(pl);renderOverlay();break;}
    case 'pl-exit':{const pl=ui.player;if(pl&&!pl.done&&Date.now()-pl.t0>10000){playerExitSheet();break;}exitPlayer();break;}
    case 'pl-exit-yes':sheet('');exitPlayer();break;
  }
  /* Catch-all: any action that earned a level (adding a goal you've already beaten, editing a finished workout) still gets its moment */
  celebrateLevels(prof(),450);
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.dataset&&t.dataset.tk){setTimerValue(t.dataset.tk,+t.value);return;}
  if(t.id==='swap-q'){const p=prof();const sl=findSlot(p,ui.swapSid);if(sl)$('#swap-list').innerHTML=swapList(p,sl,t.value);return;}
  if(t.id==='circ-q'){const p=prof();const w=planWorkouts(p).find(x=>x.id===ui.swapSid.slice(0,-1));if(w)$('#circ-list').innerHTML=circList(p,w,t.value);return;}
  if(t.id==='su-text'||t.id==='su-sport'){ui.setup.a[t.dataset.k]=t.value;return;}
  if(t.dataset&&t.dataset.note&&ui.open){const {s}=curSession();s.ex[t.dataset.note].note=t.value;save();return;}
  if(!t.dataset||!t.dataset.f||!ui.open)return;
  const {p,s,key}=curSession();const e=s.ex[t.dataset.sid];const i=+t.dataset.i;const st=e.sets[i];const v=num(t.value);
  const h=exHistory(p,e.name,key,s.date);const prev=h.length?h[h.length-1].sets:null;
  if(t.dataset.f==='kg'){st.kg=v;
    for(let j=i+1;j<e.sets.length;j++){const el=$('#kg-'+t.dataset.sid+'-'+j);if(el){const ph=phKg(e,j,prev,null);el.placeholder=ph==null?'kg':kgS(ph);}}}
  else{st.reps=v==null?null:Math.round(v);
    for(let j=i+1;j<e.sets.length;j++){const el=$('#rp-'+t.dataset.sid+'-'+j);if(el){const ph=phReps(e,j,prev);el.placeholder=ph==null?el.dataset.t:ph;}}}
  if(st.done){const sm=$('#sum-'+t.dataset.sid);if(sm)sm.innerHTML=summaryHTML(e,false);}
  save();
});
document.addEventListener('change',ev=>{
  const t=ev.target;const p=prof();
  if(t.id==='carry'){p.plan.carry=t.checked;save();render();}
  else if(t.id==='trim'){p.plan.trim=t.checked;save();render();}
  else if(t.id==='wo-date'&&ui.open){const {s}=curSession();if(t.value)s.date=t.value;save();}
  else if(t.id==='prog-ex'){ui.progEx=t.value;render();}
  else if(t.id==='tm-sound'){p.timers=Object.assign({},p.timers,{sound:t.checked});save();if(t.checked){cue.unlock();cue.count();}}
  else if(t.dataset&&t.dataset.pick!=null&&ui.setup){const s=ui.setup.picks[+t.dataset.pick];s.on=t.checked;const off=new Set(ui.setup.off||[]);if(t.checked)off.delete(s.sid);else off.add(s.sid);ui.setup.off=[...off];}
  if(t.id==='bk-file'&&t.files&&t.files[0]){const r=new FileReader();r.onload=()=>{const box=$('#bk-in');if(box)box.value=String(r.result||'');toast(readBackup(r.result)?'Backup loaded. Tap Restore to use it':"That file isn't a PR Club backup");};r.readAsText(t.files[0]);}
  /* Trimming a plan can complete a week, which can complete a level */
  if(t.id==='carry'||t.id==='trim')celebrateLevels(p,300);
});
/* Enter (Go/Done on a phone keyboard) submits the one-field forms */
const ENTER_ACT={'w-name':'start','np-name':'addp','rn-name':'renamep'};
document.addEventListener('keydown',ev=>{
  /* Next on the kg box moves to reps; Done on reps logs the set */
  if(ev.key==='Enter'&&ev.target.dataset&&ev.target.dataset.f&&ui.open){ev.preventDefault();const {sid,f}=ev.target.dataset;const i=+ev.target.dataset.i;
    if(f==='kg'){const r=$(`#rp-${sid}-${i}`);if(r)r.focus();}else{ev.target.blur();const {s}=curSession();if(!s.ex[sid].sets[i].done)tick(sid,i);}return;}
  if(ev.key==='Escape'&&document.querySelector('.fx')){document.querySelector('.fx').click();return;}
  if(ev.key==='Enter'&&ENTER_ACT[ev.target.id]){ev.preventDefault();const b=$(`[data-act=${ENTER_ACT[ev.target.id]}]`);if(b)b.click();return;}if(ev.key==='Escape'){if(ui.sheetOpen)sheet('');else if(ui.mode==='player')$('[data-act=pl-exit]').click();else if(ui.mode)closeOverlay();}});

render();
celebrateLevels(prof(),0);
{const r=state.resume,p=prof();if(r&&p&&p.plan&&Date.now()-r.t<4*3600e3&&planWorkouts(p).some(w=>w.id===r.wid))openWorkout(r.wid);else if(r){delete state.resume;save();}}
})();
</script>

<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
